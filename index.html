<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Sök tentor | LiU Tentor</title>
    <meta
      name="description"
      content="Hitta och plugga på gamla tentor från Linköpings Universitet"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="LiU Tentor" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sök tentor | LiU Tentor" />
    <meta property="og:description" content="Hitta och plugga på gamla tentor från Linköpings universitet" />
    <meta property="og:url" content="https://liutentor.se/" />
    <meta property="og:image" content="https://liutentor.se/logo.svg" />
    <meta property="og:locale" content="sv_SE" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sök tentor | LiU Tentor" />
    <meta name="twitter:description" content="Hitta och plugga på gamla tentor från Linköpings universitet" />
    <link rel="canonical" href="https://liutentor.se/" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/site.webmanifest" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <script>
      // Set the theme class before first paint to avoid a flash.
      (function () {
        try {
          var pref = localStorage.getItem("color-mode") || "system";
          if (pref === "dim") {
            pref = "dark";
            localStorage.setItem("color-mode", pref);
          }
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.getElementById("favicon").href = dark
            ? "/favicon-dark.svg"
            : "/favicon-light.svg";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
