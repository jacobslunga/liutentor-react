[build]
  command = "pnpm build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Same-origin proxy to the Go exam service (it does not send CORS headers).
[[redirects]]
  from = "/api/go/*"
  to = "https://liutentor-go-687405545415.europe-west1.run.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output never changes, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
