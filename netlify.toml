[build]
  command = "pnpm build"
  publish = "dist"

# Same-origin proxy to the Go exam service (it does not send CORS headers).
[[redirects]]
  from = "/api/go/*"
  to = "https://liutentor-go-687405545415.europe-west1.run.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
